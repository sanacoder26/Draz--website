<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Daraz Clone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="https://images.seeklogo.com/logo-png/42/1/daraz-logo-png_seeklogo-429389.png" height="35" alt="Daraz Logo">
      </a>
    </div>
  </nav>

  <!-- Sign Up Form -->
  <div class="container d-flex justify-content-center align-items-center" style="height: 90vh;">
    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">
      <h3 class="text-center mb-4">Create Account</h3>
      <form>
        <div class="mb-3">
          <input type="text" class="form-control" placeholder="Full Name" required>
        </div>
        <div class="mb-3">
          <input type="email" class="form-control" placeholder="Email" required>
        </div>
        <div class="mb-3">
          <input type="password" class="form-control" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-warning w-100">Sign Up</button>
        <p class="text-center mt-3 mb-0">Already have an account? <a href="login.html" class="text-decoration-none text-warning">Login</a></p>
         <a href="index.html" style="text-decoration: none; color: goldenrod;">Back to home</a>
    </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
